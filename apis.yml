name: Assemble Labs
description: Assemble Labs is an AI-powered hardware testing platform that autonomously designs and runs
  experiments on embedded systems, letting engineers validate firmware against specifications using real
  lab instruments without manual setup. It converts engineering requirements into executable test cases,
  drives physical devices through real instrument control (oscilloscopes, power profilers, logic
  analyzers from Saleae, Tektronix, Keysight, Rohde & Schwarz, Fluke, Yokogawa, National Instruments and
  Joulescope), performs root-cause analysis, proposes firmware fixes, and verifies them on actual
  hardware. Test results and reports are committed to Git for traceability. The product runs on-premises
  and air-gapped with zero data egress, and integrates with VS Code, Cursor, and Claude. Assemble Labs
  is an early-stage company (pre-seed, $1.3M led by Menlo Ventures) and is tracked in the API Evangelist
  network as a portfolio lead; it does not yet publish a public API, developer portal, or SDKs.
